<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Dokter Poli</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        h2 { text-align: center; color: #1a5276; }
        .filter-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 8px 12px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2e86c1; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .offline-status { text-align: center; font-size: 12px; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>JADWAL DOKTER POLI</h2>

    <div class="filter-box">
        <select id="filterHari" onchange="filterData()">
            <option value="Semua">-- Semua Hari --</option>
            <option value="SENIN">Senin</option>
            <option value="SELASA">Selasa</option>
            <option value="RABU">Rabu</option>
            <option value="KAMIS">Kamis</option>
            <option value="JUMAT">Jumat</option>
            <option value="SABTU">Sabtu</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Poli / Unit</th>
                <th>Shift</th>
                <th>Hari</th>
                <th>Dokter Bertugas</th>
            </tr>
        </thead>
        <tbody id="tabelJadwal">
            <!-- Data dimasukkan via script -->
        </tbody>
    </table>

    <div class="offline-status">✓ Mode Sistem: Online & Offline</div>

    <script>
        const dataJadwal = [
            { poli: "Poli Umum", shift: "Pagi (A)", hari: "SENIN", dokter: "dr. Irma" },
            { poli: "Poli Umum", shift: "Pagi (A)", hari: "SELASA", dokter: "dr. Endang" },
            { poli: "Poli Umum", shift: "Pagi (A)", hari: "RABU", dokter: "dr. Rizky" },
            { poli: "Poli Umum", shift: "Pagi (A)", hari: "KAMIS", dokter: "dr. Rachma" },
            { poli: "Poli Umum", shift: "Pagi (A)", hari: "JUMAT", dokter: "dr. Pristy" },
            { poli: "Poli Umum", shift: "Pagi (A)", hari: "SABTU", dokter: "dr. Irma" },
            { poli: "Poli Gigi", shift: "Pagi (Gigi 1)", hari: "SENIN", dokter: "drg. Riris" },
            { poli: "Poli Gigi", shift: "Pagi (Gigi 1)", hari: "SELASA", dokter: "drg. Riris" },
            { poli: "Poli Gigi", shift: "Pagi (Gigi 1)", hari: "RABU", dokter: "drg. Riris" }
        ];

        function tampilkanJadwal(list) {
            const tbody = document.getElementById("tabelJadwal");
            tbody.innerHTML = "";
            list.forEach(item => {
                tbody.innerHTML += `<tr>
                    <td><b>${item.poli}</b></td>
                    <td>${item.shift}</td>
                    <td>${item.hari}</td>
                    <td><b>${item.dokter}</b></td>
                </tr>`;
            });
        }

        function filterData() {
            const hari = document.getElementById("filterHari").value;
            const hasil = hari === "Semua" ? dataJadwal : dataJadwal.filter(d => d.hari === hari);
            tampilkanJadwal(hasil);
        }

        tampilkanJadwal(dataJadwal);
    </script>
</body>
</html>
